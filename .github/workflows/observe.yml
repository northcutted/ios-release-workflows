name: Observe App Store releases
on:
  workflow_call:
    inputs:
      config:
        type: string
        default: .github/ios-release.json
      platform_revision:
        type: string
        required: true
    secrets:
      APP_STORE_CONNECT_API_KEY_ID:
        description: Resolved from the job protected environment; bind the same name in the caller.
        required: false
      APP_STORE_CONNECT_API_KEY_ISSUER_ID:
        description: Resolved from the job protected environment; bind the same name in the caller.
        required: false
      APP_STORE_CONNECT_API_KEY_CONTENT:
        description: Resolved from the job protected environment; bind the same name in the caller.
        required: false
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
      actions: read
    steps:
      - name: Checkout data and source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: main
      - name: Load pinned platform tools
        uses: $/actions/bootstrap
        with:
          config: ${{ inputs.config }}
          revision: ${{ inputs.platform_revision }}
      - name: Install pinned SLSA verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6
      - name: Install locked platform gems
        uses: $/actions/ruby
      - name: Find active immutable releases
        run: python3 "$IOS_RELEASE_ROOT/scripts/ci/observe.py"
        env:
          GH_TOKEN: ${{ github.token }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      - name: Retain observations-${{ github.run_id }}-${{ github.run_attempt }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/observations/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
        if: always()
    environment: app-store-observe
