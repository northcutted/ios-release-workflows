name: Platform checks
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Create consumer bootstrap fixture
        run: |-
          python3 - <<'PY'
          import json,os,pathlib
          config=json.loads(pathlib.Path('examples/minimal.json').read_text())
          config['repository']=os.environ['GITHUB_REPOSITORY']
          pathlib.Path('build').mkdir(exist_ok=True)
          pathlib.Path('build/consumer.json').write_text(json.dumps(config))
          PY
      - uses: $/actions/bootstrap
        with:
          config: build/consumer.json
          revision: ${{ github.sha }}
      - uses: $/actions/ruby
      - name: Run cross-consumer and release regression tests
        run: ios-release check --apple
      - name: Install platform-appropriate SLSA verifier
        uses: $/actions/slsa-verifier
      - name: Exercise installed verifier
        run: slsa-verifier version
      - name: Check workflow boundaries and syntax
        if: runner.os == 'Linux'
        run: ios-release check --syntax
      - name: Check Ruby and shell syntax
        run: |-
          ruby -c fastlane/Fastfile
          for script in scripts/ci/*.sh; do bash -n "$script"; done
      - name: Build and smoke test the installed wheel
        run: |
          uv build --wheel
          uv venv "$RUNNER_TEMP/wheel-test"
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-test/bin/ios-release" --commands-json
          "$RUNNER_TEMP/wheel-test/bin/ios-release" doctor
          "$RUNNER_TEMP/wheel-test/bin/ios-release" qa --help
