name: Bug report
description: Report a reproducible CLI, signing, QA, or release problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Include redacted diagnostics only. Do not attach API keys, signing passwords, private keys, P12 files, or credential-bearing upload URLs."
  - type: dropdown
    id: interface
    attributes:
      label: Which interface?
      options:
        - Native Rust CLI / native Actions
        - Existing Python/Ruby compatibility platform
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: CLI package/source revision, OS/architecture, and Xcode version/build when relevant. Include redacted doctor output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Command or workflow operation, minimal app/configuration details, and steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include the error and redacted logs; link a public Actions run if available.
    validations:
      required: true
