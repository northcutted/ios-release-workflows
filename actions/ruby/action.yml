name: Locked platform Ruby
description: Install platform-owned dependencies without consumer Ruby evaluation
runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
      with:
        ruby-version: 3.4.10
        bundler-cache: false
    - shell: bash
      run: bundle install --jobs 4 --retry 3
      env:
        BUNDLE_FROZEN: "true"
