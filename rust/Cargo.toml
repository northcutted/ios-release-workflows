[package]
name = "ios-release-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Native Xcode automation with explicit simulator and release contracts"
license = "MIT"
publish = false

[[bin]]
name = "ios-release"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
plist = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
