name: OrbitNotes
options:
  bundleIdPrefix: dev.iosrelease.fixture
  deploymentTarget:
    iOS: '18.0'
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
targets:
  OrbitNotes:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.iosrelease.fixture.OrbitNotes
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: OrbitShare
  OrbitShare:
    type: app-extension
    platform: iOS
    sources: [Share]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Orbit Share
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.iosrelease.fixture.OrbitNotes.share
        SKIP_INSTALL: YES
  OrbitNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: OrbitNotes
  OrbitNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: OrbitNotes
schemes:
  OrbitNotes:
    build:
      targets:
        OrbitNotes: all
        OrbitShare: all
        OrbitNotesTests: [test]
        OrbitNotesUITests: [test]
    test:
      targets: [OrbitNotesTests, OrbitNotesUITests]
    archive:
      config: AppStore
